# ==============================================================================
# NetDiag-C Diagnostic Threshold Configuration
# ==============================================================================
# This configuration file defines the operational tolerance boundaries for
# network link performance and optical transceiver Digital Diagnostic Monitoring (DDM).
#
# Values exceeding WARNING limits generate alert diagnostics.
# Values exceeding CRITICAL limits trigger emergency intervention workflows.
# ==============================================================================

[network_thresholds]
# Round-trip latency thresholds in milliseconds (ms)
latency_warning_ms = 50.0
latency_critical_ms = 150.0

# Packet drop rate percentage (%)
packet_loss_warning_pct = 1.0
packet_loss_critical_pct = 5.0

# Delay variance / jitter in milliseconds (ms)
jitter_warning_ms = 10.0
jitter_critical_ms = 30.0

# Link bandwidth utilization percentage (%)
bandwidth_warning_pct = 80.0
bandwidth_critical_pct = 95.0

[optical_ddm_thresholds]
# Optical Receiver Power (RX Power) in dBm
# SFF-8472 / SFF-8636 Standard 10G/100G link parameters
rx_power_low_warning_dbm = -17.0
rx_power_low_critical_dbm = -22.0
rx_power_high_warning_dbm = 0.0
rx_power_high_critical_dbm = 2.0

# Optical Transmitter Power (TX Power) in dBm
tx_power_low_warning_dbm = -7.0
tx_power_low_critical_dbm = -10.0
tx_power_high_warning_dbm = 1.0
tx_power_high_critical_dbm = 3.0

# Laser Diode Forward Bias Current in mA
laser_bias_warning_ma = 55.0
laser_bias_critical_ma = 80.0

# Transceiver Internal Case Temperature in Celsius (°C)
temp_warning_c = 65.0
temp_critical_c = 75.0

# Internal Supply Voltage Rail in Volts (V) [Nominal 3.30V]
voltage_low_warning_v = 3.15
voltage_low_critical_v = 3.00
voltage_high_warning_v = 3.45
voltage_high_critical_v = 3.60
